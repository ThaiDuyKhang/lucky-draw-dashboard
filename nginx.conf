server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Ảnh, âm thanh, font, thư viện: cho trình duyệt cache 7 ngày
    location ~* \.(png|jpg|jpeg|gif|ico|svg|mp3|woff2?|ttf|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
