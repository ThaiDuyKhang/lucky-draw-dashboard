# Chạy trên máy chủ riêng bằng Docker (không dùng Cloudflare):
#   1. Tạo file .dev.vars:  ADMIN_PASSWORD=mat-khau-cua-ban
#   2. docker compose up -d   ->  http://IP-may-chu:8080/dashboard
# Dữ liệu lưu trong thư mục .wrangler/ (giữ lại khi cập nhật).
services:
  lucky-draw:
    image: node:22-bookworm-slim
    container_name: vong_quay
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx wrangler dev --ip 0.0.0.0 --port 8080"
    environment:
      - WRANGLER_SEND_METRICS=false
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
