<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon">
    <link href="./libs/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./libs/jquery-3.6.0.min.js"></script>
    <script src="./libs/lottie.min.js"></script>
    <!-- GSAP 3.14.1 được tải sẵn về libs/ để chạy được cả khi không có Internet -->
    <script src="./libs/gsap.min.js"></script>
    <script src="./libs/SplitText.min.js"></script>
    <title>Vòng Quay May Mắn - EZtech</title>
</head>

<body>
    <div class="container mt-5 pt-4">
        <h1 class="main-title text-center mb-4">VÒNG QUAY MAY MẮN</h1>

        <div class="row justify-content-center">
            <div class="col-lg-12">
                <div class="wheel-container">
                    <div class="ez-wheel-wrapper">
                        <div class="custom-wheel position-relative">
                            <img src="./images/wheel.png" alt="Vòng quay EZ TECH"
                                class="wheel-image position-absolute" />
                            <svg class="wheel" viewBox="0 0 500 500" width="700" height="700"></svg>
                        </div>

                        <div class="spin-button-wrapper">
                            <img src="./images/button-wheel.png" alt="Nút quay EZ" class="spin-button-image"
                                id="ez-spin-btn" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal chúc mừng người trúng -->
    <div class="modal fade" id="congratsModal" tabindex="-1" aria-labelledby="congratsModalLabel" aria-hidden="true"
        data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen">
            <div class="modal-content justify-content-center">
                <div class="modal-header mx-auto mb-3 stage justify-content-center" style="background: transparent;">
                    <div class="content">
                        <h1 class="txt text-center" style="opacity: 0; visibility: hidden;">Chúc mừng bạn đã trúng
                            thưởng</h1>
                    </div>
                </div>
                <div class="modal-body bg-white text-center rounded-0 py-3 mb-5 px-5 mx-auto flex-grow-0"
                    id="prize-container" style="opacity: 0; visibility: hidden;">
                    <h2 id="prize-text" class="display-2 fw-bold"></h2>
                </div>
                <div class="modal-footer bg-transparent d-flex flex-column justify-content-center gap-3 align-items-center mt-5 border-0"
                    id="modal-buttons" style="opacity: 0; visibility: hidden;">
                    <a href="javascript:void(0)" class="btn btn-lg btn-warning" data-bs-dismiss="modal">Quay tiếp</a>
                    <a href="dashboard.html" class="btn btn-lg btn-outline-light">Xem danh sách trúng thưởng</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="./libs/bootstrap-icons.css">

    <script src="./libs/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
