<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon">
    <link href="./libs/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./libs/jquery-3.6.0.min.js"></script>
    <script src="./libs/lottie.min.js"></script>
    <title>Vòng Quay May Mắn - EZtech</title>
</head>

<body>
    <div class="container mt-5 pt-4">
        <h1 class="main-title text-center mb-4">VÒNG QUAY MAY MẮN</h1>

        <div class="row justify-content-center">
            <div class="col-lg-12">
                <div class="wheel-container">
                    <div class="ez-wheel-wrapper">
                        <div class="custom-wheel position-relative">
                            <img src="./images/wheel.png" alt="Vòng quay EZ TECH"
                                class="wheel-image position-absolute" />
                            <svg class="wheel" viewBox="0 0 500 500" width="700" height="700"></svg>
                        </div>

                        <div class="spin-button-wrapper">
                            <img src="./images/button-wheel.png" alt="Nút quay EZ" class="spin-button-image"
                                id="ez-spin-btn" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal chúc mừng người trúng -->
    <div class="modal fade" id="congratsModal" tabindex="-1" aria-labelledby="congratsModalLabel" aria-hidden="true"
        data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <img src="./images/text.png" alt="Chúc mừng bạn trúng thưởng"
                    class="modal-header-image img-fluid mx-auto d-block mb-2" />
                <div class="bg-white">
                    <h4 id="prize-text" class="display-6 fw-bold my-3"></h4>
                </div>

                <div class="modal-body d-flex flex-column justify-content-center gap-3 align-items-center">
                    <a href="javascript:void(0)" class="btn btn-primary" data-bs-dismiss="modal">Quay tiếp</a>
                    <a href="dashboard.html" class="btn btn-outline-secondary">Xem danh sách trúng thưởng</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="./libs/bootstrap-icons.css">

    <script src="./libs/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
